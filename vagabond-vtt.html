<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vagabond VTT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%231c1a24'/%3E%3Cpath d='M32 7 54 19.5v25L32 57 10 44.5v-25z' fill='none' stroke='%23e0b24a' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M21 22l11 22 11-22' fill='none' stroke='%23f3d27a' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#15120e; --panel:#201b15; --panel2:#2a231b; --line:#3e3427; --ink:#ece2cf; --muted:#a39478;
  --accent:#d9a441; --accent-ink:#1b150c; --good:#7fb069; --bad:#d4583b; --crit:#f0cf4a; --input:#17130e;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=range]{padding:0;accent-color:var(--accent)}
textarea{width:100%;resize:vertical;min-height:70px}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.small{padding:2px 7px;font-size:12px}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
button.pulse{box-shadow:0 0 0 0 rgba(217,164,65,.7);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(217,164,65,0)}100%{box-shadow:0 0 0 0 rgba(217,164,65,0)}}
label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
label input,label select{color:var(--ink);font-size:14px}
label.inline{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.pixel{image-rendering:pixelated}

/* layout */
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
#tabs{min-height:0;display:grid;grid-template-rows:minmax(0,1fr)}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font-weight:800;letter-spacing:.08em;color:var(--accent);font-size:16px}
header nav{display:flex;gap:4px}
header nav button{border-radius:999px;padding:5px 14px}
header .spacer{flex:1}
#main{display:grid;grid-template-columns:1fr 300px;grid-template-rows:minmax(0,1fr);min-height:0}
#main.nolog{grid-template-columns:1fr 0}
.tab{display:none;min-height:0;overflow:hidden}
.tab.active{display:grid}

/* log */
#log{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#log .dice{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
#log .quick{display:flex;flex-wrap:wrap;gap:4px}
#logList{flex:1;overflow:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.entry{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:6px;padding:6px 8px}
.entry.pass{border-left-color:var(--good)} .entry.fail{border-left-color:var(--bad)} .entry.crit{border-left-color:var(--crit)}
.entry .who{font-weight:600} .entry .res{float:right;font-weight:800;font-size:12px}
.entry.pass .res{color:var(--good)} .entry.fail .res{color:var(--bad)} .entry.crit .res{color:var(--crit)}
.entry .big{font-size:20px;font-weight:800}
.entry .det{font-size:12px;color:var(--muted)}

/* heroes */
#tab-heroes{grid-template-columns:210px 1fr}
.side{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:4px}
.li{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;border:1px solid transparent;cursor:pointer}
.li:hover{background:var(--panel2)}
.li.sel{background:var(--panel2);border-color:var(--accent)}
.li img,.li .ph{width:32px;height:32px;border-radius:4px;background:var(--input);flex:none;object-fit:contain}
.li .t{line-height:1.2} .li .t small{display:block;color:var(--muted);font-size:11px}
#sheet{overflow:auto;padding:14px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card.wide{grid-column:1/-1}
.idgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.portraitBox{display:flex;flex-direction:column;align-items:center;gap:4px}
.portrait{width:96px;height:96px;border-radius:8px;background:repeating-conic-gradient(#2a241c 0 25%,#221d16 0 50%) 0 0/12px 12px;border:1px solid var(--line);flex:none;object-fit:contain}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.stat .n{font-size:11px;letter-spacing:.1em;color:var(--muted)}
.stat input{width:56px;text-align:center;font-size:22px;font-weight:800;border:none;background:transparent}
.rows{display:flex;flex-direction:column;gap:2px}
.rrow{display:grid;grid-template-columns:22px 1fr 44px 52px;align-items:center;gap:6px;padding:3px 4px;border-radius:5px}
.rrow:hover{background:var(--panel2)}
.rrow .dc{font-weight:800;text-align:center;background:var(--input);border-radius:5px;padding:1px 0}
.rrow .nm small{color:var(--muted)}
.vit{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
.box .lab{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.box .val{font-size:22px;font-weight:800}
.box input.num{width:52px;font-size:20px;font-weight:800;text-align:center}
.pips{display:flex;gap:4px;margin-top:4px}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--input);cursor:pointer;padding:0}
.pip.on{background:var(--bad);border-color:var(--bad)}
.bar{height:8px;background:var(--input);border-radius:4px;overflow:hidden;margin-top:4px}
.bar > i{display:block;height:100%;background:var(--good)}
.bar.over > i{background:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:2px 4px}
table.t td{padding:2px 3px;vertical-align:middle}
table.t input,table.t select{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border-radius:999px;padding:3px 10px;font-size:12px}
.req{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;margin:1px 3px 1px 0;border:1px solid}
.req.ok{color:var(--good);border-color:rgba(127,176,105,.5)}
.req.no{color:var(--bad);border-color:rgba(212,88,59,.5)}
.traits{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;flex-direction:column;gap:3px}
.traits b{color:var(--ink)}
.warn{color:var(--bad);font-size:12px}
.favor{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.favor button{border:none;border-radius:0;padding:4px 10px}
.perk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);margin-bottom:5px}
.perk .pn{font-weight:700}
.perk .pd{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:100%;color:var(--muted)}

/* map */
#tab-map{grid-template-columns:250px 1fr}
#mapWrap{position:relative;min-height:0;overflow:hidden;background:#0b0907}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#mapTint,#mapUI,#mapGL{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mapGL{visibility:hidden}
#mapTint{opacity:0}
.encRow{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.encList{display:flex;flex-direction:column;gap:5px;margin:8px 0;max-height:38vh;overflow:auto}
.encMon{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.encMon img,.encMon .ph{width:36px;height:36px;image-rendering:pixelated}
.encAdd{flex-wrap:wrap;gap:4px}
.encAdd button img,.encAdd button .ph{width:18px;height:18px;image-rendering:pixelated;vertical-align:middle}
.faceRow{align-items:center;flex-wrap:wrap}
.photoGrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px!important}
.phRef{background:linear-gradient(#1b2433,#0f141c);border-radius:8px;width:170px;height:300px}
.phEdit.tool-wand{cursor:crosshair}.phEdit.tool-erase{cursor:cell}.phEdit.tool-restore{cursor:copy}
.sclStep{display:inline-flex;align-items:center;gap:2px;flex:none}
.sclStep button{width:24px;padding:2px 0;font-weight:700}
.sclStep b{min-width:40px;text-align:center;font-size:12px;cursor:pointer;user-select:none}
.spellList{display:flex;gap:4px;overflow-x:auto;max-width:min(62vw,720px);padding-bottom:2px}
.abBtn.spell .ic{font-size:16px}.abBtn.spellBtn{border-color:#a98bff}
.spellOpts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:min(56vw,560px)}
.spellOpts .seg{display:inline-flex;gap:2px;align-items:center}.spellOpts .seg b{padding:0 6px;font-size:12px}
.spellOpts .warn{color:#ff8a7a;font-weight:700}
.pUser{font-weight:400;color:var(--muted);font-size:11px}
.emoteRow.big button{font-size:20px;line-height:26px}
.kindSwitch{display:inline-flex;gap:2px;margin-top:14px}
.touchRow{align-items:center;flex-wrap:wrap;gap:4px;padding:6px 8px;border:1px dashed var(--line);border-radius:8px}
@media (max-width:900px){.photoGrid{grid-template-columns:1fr 1fr!important}.photoGrid .pv:last-child{grid-column:1/-1}}
.steamSteps{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.steamSteps>div{display:flex;align-items:center;gap:10px;color:var(--muted)}
.steamSteps i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;border:2px solid var(--line)}
.steamSteps .done{color:var(--ink)}.steamSteps .done i{background:var(--good);border-color:var(--good);color:#0b1a0b}
.steamSteps .now{color:var(--ink);font-weight:700}.steamSteps .now i{border-color:var(--accent);border-top-color:transparent;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.steamNow{padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.rosterList{display:flex;flex-direction:column;gap:4px}
.hostCard{display:flex;flex-direction:column;gap:6px;padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.hostCard .chip{margin:1px}
#netBtn.net-wait{border-color:#e0a83a;color:#f0cf4a}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.brushes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.brushes button{padding:2px;aspect-ratio:1;position:relative}
.brushes img{width:100%;height:100%;display:block;object-fit:contain}
.brushes .k{position:absolute;right:1px;bottom:0;font-size:9px;font-weight:800;color:#fff;text-shadow:0 0 2px #000}
.sect{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
#combatBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(20,16,12,.92);border:1px solid var(--accent);border-radius:999px;padding:5px 6px 5px 14px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.5);white-space:nowrap}
#combatBar[hidden]{display:none}
#combatBar .side-h{color:#8fc1ea} #combatBar .side-e{color:#e88a6f}
[draggable=true]{cursor:grab}
.fxTypes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.fxTypes button{padding:4px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center}
.fxTypes .ic{font-size:18px;line-height:1.15}
.stIcons{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.stIcons button{padding:2px 0;font-size:15px}
.heroChips{display:flex;flex-wrap:wrap;gap:4px}
.heroChip{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 2px;border-radius:999px}
.heroChip img,.heroChip .ph{width:24px;height:24px;border-radius:50%;background:var(--input)}
.fxList{display:flex;flex-direction:column;gap:3px}
.fxList div{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--panel2);border-radius:6px;padding:2px 4px 2px 8px}
#mapHint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;pointer-events:none}

/* sprites */
#tab-sprites{grid-template-columns:210px 1fr 260px}
#sprCenter{display:flex;align-items:center;justify-content:center;overflow:auto;padding:14px}
#sprCanvas{width:min(70vh,560px);height:min(70vh,560px);border:1px solid var(--line);cursor:crosshair;touch-action:none;background:#000}
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.sw{aspect-ratio:1;border-radius:4px;border:2px solid transparent;cursor:pointer;padding:0}
.sw.sel{border-color:#fff}
#sprPrev{display:flex;gap:10px;align-items:end}
#sprPrev img{background:repeating-conic-gradient(#3a3a3a 0 25%,#2a2a2a 0 50%) 0 0/8px 8px;border:1px solid var(--line)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal[hidden]{display:none}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.dlg header{background:var(--panel2);border-bottom:1px solid var(--line)}
.dlg .body{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.dlg footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.photoGrid .pv{display:flex;flex-direction:column;align-items:center;gap:6px}
.photoGrid img,.photoGrid canvas{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#2a241c 0 25%,#221d16 0 50%) 0 0/16px 16px}
.ctrl{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted)}
.genTypes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.genTypes button{padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.genTypes .ic{font-size:24px}

body.noGM .gmOnly{display:none!important}
/* ---------- animation basics ---------- */
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,207,74,.0)}50%{box-shadow:0 0 14px 2px rgba(240,207,74,.55)}}
#modal:not([hidden]) .dlg{animation:popIn .22s ease-out}
.dlg.wide{width:min(1060px,100%)}
.bStep.fromR{animation:slideR .28s ease-out}.bStep.fromL{animation:slideL .28s ease-out}.bStep.still{animation:none}
.entry.fresh,.chat.fresh{animation:fadeUp .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
/* ---------- header ---------- */
#modeBtn{font-weight:700}
#logBtn.ping{animation:glowPulse 1.2s infinite}
.buildBtn{padding:9px;font-size:15px}
/* ---------- map HUD ---------- */
#mapWrap{user-select:none}
#combatBar{z-index:4} #worldBar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(32,24,14,.92);border:1px solid #8a6b3f;border-radius:999px;padding:6px 8px 6px 16px;z-index:4;white-space:nowrap;max-width:94%}
#worldBar[hidden],#partyBar[hidden],#actionBar[hidden],.floatWin[hidden],#ctx[hidden]{display:none}
#partyBar{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:3;max-height:calc(100% - 90px);overflow:auto;padding-right:4px}
.pCard{display:flex;gap:8px;align-items:center;background:rgba(20,16,12,.86);border:1px solid var(--line);border-radius:10px;padding:5px 9px 5px 5px;width:190px;cursor:pointer;transition:transform .15s,border-color .2s;animation:fadeUp .3s ease-out}
.pCard:hover{transform:translateX(3px);border-color:var(--accent)}
.pCard.sel{border-color:#fff}.pCard.mine{border-color:var(--accent)}
.pCard.active{animation:glowPulse 1.6s infinite}
.pCard.hit{animation:shake .45s}.pCard.hit .pBar i{background:#ff5a4a}
.pCard.healed .pBar{box-shadow:0 0 8px #8df07a}
.pCard.down{filter:grayscale(.8);opacity:.75}
.pPic{position:relative;width:40px;height:40px;flex:none;border-radius:8px;background:repeating-conic-gradient(#2a241c 0 25%,#221d16 0 50%) 0 0/10px 10px;overflow:hidden}
.pPic img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.pSkull{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;background:rgba(0,0,0,.45)}
.pInfo{flex:1;min-width:0}.pName{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pOn{color:var(--good);font-size:10px}
.pBar{position:relative;height:12px;background:#0d0b08;border-radius:6px;overflow:hidden;margin:3px 0}
.pBar i{display:block;height:100%;background:linear-gradient(90deg,#5f9a49,#8bc46d);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pBar.mid i{background:linear-gradient(90deg,#c4882a,#e0a83a)}.pBar.low i{background:linear-gradient(90deg,#a8321f,#d4583b)}
.pBar span{position:absolute;inset:0;font-size:10px;font-weight:700;display:grid;place-items:center;text-shadow:0 1px 2px #000}
.pMini{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
#actionBar{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;background:rgba(20,16,12,.92);border:1px solid var(--accent);border-radius:14px;padding:7px;z-index:4;animation:fadeUp .25s ease-out;max-width:calc(100% - 20px);overflow-x:auto}
.abWho{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;padding:0 6px;border-right:1px solid var(--line);min-width:62px}
.abWho img,.abWho .ph{width:34px;height:34px;image-rendering:pixelated}
.abBtn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:76px;padding:6px 8px;border-radius:10px;transition:transform .12s, background .2s}
.abBtn:hover{transform:translateY(-3px);background:#3a3024}
.abBtn .ic{font-size:20px}.abBtn b{font-size:12px;white-space:nowrap}.abBtn small{font-size:10px;color:var(--muted);white-space:nowrap}
.abBtn.atk{border-color:#7a3a2a;background:#3a211a}.abBtn.atk:hover{background:#5a2a1f}
.abFav{display:flex;flex-direction:column;gap:3px;justify-content:center;border-left:1px solid var(--line);padding-left:6px}
.abHint{align-self:center;padding:0 10px}
.floatWin{position:absolute;z-index:5;background:rgba(24,19,14,.96);border:1px solid var(--accent);border-radius:12px;width:290px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:popIn .2s ease-out}

.meCard .pBar.mid i,.ppRow .pBar.mid i{background:#e0a83a}.meCard .pBar.low i,.ppRow .pBar.low i{background:var(--bad)}
.meCard .pBar span,.ppRow .pBar span{position:relative;font-size:10px;font-weight:700;padding-left:6px;line-height:14px}
.howto ol{margin:4px 0;padding-left:18px}
/* ---------- v3: move & draft bars ---------- */
#moveBar{position:absolute;left:50%;bottom:132px;transform:translateX(-50%);z-index:8;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:rgba(20,16,12,.94);border:1px solid #8fe07a;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:barIn .18s ease-out}
#moveBar .warn{color:#e0a83a;font-weight:700}
#draftBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;display:flex;white-space:nowrap;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(40,30,12,.94);border:1px dashed var(--accent);font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
@keyframes barIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.pCard.npc{border-color:rgba(127,176,255,.5)}

#tab-players{overflow:auto}
.ppWrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;padding:14px;align-content:start}
.ppWrap .wide2{grid-column:1/-1}
.ppWrap .card{display:flex;flex-direction:column;gap:8px}
.ppRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.ppRow.off{opacity:.6}
.ppRow .dot{width:9px;height:9px;border-radius:50%;background:#666}.ppRow.on .dot{background:var(--good);box-shadow:0 0 6px var(--good)}
.ppPic img,.ppPic .ph{width:36px;height:36px;image-rendering:pixelated;border-radius:6px;background:var(--input);display:block}
.npcGrid{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.npcGrid>input{width:130px}
.roleRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roleBtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:12px}
.roleBtn .bIc{font-size:24px}
.roleBtn.on.gm{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.roleBtn.on.pl{background:#5fa8ff;color:#0b1a2a;border-color:#5fa8ff}

<div id="app">
  <header>
    <span class="brand">VAGABOND VTT</span>

    <button data-act="openGuide" class="small" title="How to play, host and join">❓ Guide</button>

    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <input type="file" id="photoFile" accept="image/*" multiple hidden>
    <input type="file" id="sliceFile" accept="image/*" hidden>
  </header>
  <div id="main">
    <div id="tabs">
      <section class="tab active" id="tab-heroes">
        <div class="side">
          <button class="primary buildBtn" data-act="openBuilder">✨ Create a hero</button>
          <div class="row gmOnly"><button class="small grow" data-act="newHero" title="Blank sheet, fill it in yourself">+ Blank sheet</button><button class="small" data-act="quickHero" title="Random ancestry, class and stats">🎲 Random</button></div>
          <div class="list" id="heroList"></div>
        </div>
        <div id="sheet"></div>
      </section>
      <section class="tab" id="tab-map">
        <div class="side" id="mapSide"></div>

          <div id="initWin" class="floatWin" hidden></div><div id="moveBar" hidden></div><div id="draftBar" hidden></div><div id="modeBadge" hidden></div><div id="actionBar" hidden></div><div id="mapHint"></div></div>
      </section>
      <section class="tab" id="tab-sprites"><div class="side" id="libSide"></div><div id="libMain"></div></section>
      <section class="tab" id="tab-players"><div id="playersPane"></div></section>
    </div>
    <aside id="log">
      <div class="dice">

        <div class="row"><input id="diceExpr" class="grow" placeholder="2d6+1, d6!, d66 …"><button class="primary" data-act="rollExpr">Roll</button></div>
        <div class="quick">
          <button class="small" data-roll="d4">d4</button><button class="small" data-roll="d6">d6</button><button class="small" data-roll="d8">d8</button><button class="small" data-roll="d10">d10</button><button class="small" data-roll="d12">d12</button><button class="small" data-roll="d20">d20</button><button class="small" data-roll="2d6">2d6</button><button class="small" data-roll="d66">d66</button>
        </div>
        <div class="row small muted"><span>Roll as</span><select id="rollAs" class="grow"></select><button class="small gmOnly" data-act="clearLog">Clear</button></div>
      </div>
      <div class="logTabs"><button class="small on" data-logtab="all">All</button><button class="small" data-logtab="chat">💬 Chat</button><button class="small" data-logtab="rolls">🎲 Rolls</button></div>
      <div id="logList"></div>
      <div class="chatBox"><input id="chatIn" placeholder="Say something… (/r 2d6 rolls, /me waves)" maxlength="300"><button class="primary" data-act="sendChat">Send</button></div>
    </aside>
  </div>
</div>

  o.attacks = {}; ATTACKS.forEach(([k, s, t]) => o.attacks[k] = dc(st[s], tr(t)));
  o.saves = { Endure: 20 - st.MIT * 2, Reflex: 20 - (st.DEX + st.AWR), Will: 20 - (st.RSN + st.PRS) };
  const som = perkCount(h, 'Secret of Mana');

}

  const D = derive(h), out = [];

    let m;
    if ((m = tok.match(/^(MIT|DEX|AWR|RSN|PRS|LUK)(\d)$/))) out.push({ label: `${m[1]} ${m[2]}${m[2] === '7' ? '' : '+'}`, ok: h.stats[m[1]] >= +m[2] });
    else if (tok.startsWith('T:')) tok.slice(2).split('&').forEach(g => { const opts = g.split('/'); out.push({ label: 'Trained: ' + opts.join(' or '), ok: opts.some(o => h.trained[o]) }); });
    else if (tok.startsWith('S:')) { const sp = tok.slice(2);

    else if (tok === 'ADV') out.push({ label: 'A Stat below 7', ok: STATS.some(([k]) => h.stats[k] < 7) });

/* ================= DICE ================= */
function rollExpr(expr) {
  const s = String(expr).replace(/\s+/g, '').toLowerCase();
  if (!s) return null;
  const re = /([+-]?)(?:(\d*)d(\d+)(!?)|(\d+))/g;
  let m, pos = 0, total = 0; const parts = [];
  while ((m = re.exec(s))) {
    if (m.index !== pos || m[0] === '') return null;
    pos = re.lastIndex;
    const sign = m[1] === '-' ? -1 : 1, sg = sign < 0 ? '−' : (parts.length ? '+' : '');
    if (m[5] !== undefined) { total += sign * +m[5]; parts.push(sg + m[5]); continue; }
    const n = +(m[2] || 1), sides = +m[3], ex = !!m[4];
    if (n < 1 || n > 100 || sides < 1 || sides > 1000) return null;
    const rolls = [];
    for (let i = 0; i < n; i++) {
      if (sides === 66 && !ex) { const a = d(6), b = d(6); rolls.push(a * 10 + b); continue; }
      let v = d(sides), chain = [v];
      if (ex && sides > 1) while (v === sides) { v = d(sides); chain.push(v); }
      rolls.push(chain.length > 1 ? chain.join('→') : v);
    }
    const sum = rolls.reduce((a, b) => a + String(b).split('→').reduce((x, y) => x + +y, 0), 0); total += sign * sum;
    parts.push(`${sg}${n > 1 ? n : ''}d${sides}${ex ? '!' : ''}[${rolls.join(',')}]`);
  }
  if (pos !== s.length || !parts.length) return null;
  return { total, detail: parts.join(' ') };
}

    ${e.big !== undefined ? `<div class="big">${esc(e.big)}</div>` : ''}
    <div class="det">${esc(e.detail || '')}</div>${e.note ? `<div class="det" style="color:var(--crit)">${esc(e.note)}</div>` : ''}

function doFreeRoll(expr) {

  addLog({ who: rollerName(), text: 'rolls ' + expr, big: r.total, detail: r.detail });

function rollCheck(h, label, dc, kind, opts = {}) {
  const manual = ui.favor; ui.favor = 0;
  const hinderBy = autoHinder(h, kind);
  const net = clamp(manual - (hinderBy ? 1 : 0), -1, 1);

  let detail = `d20 ${n}` + (net > 0 ? ` + d6 ${m} (Favor)` : net < 0 ? ` − d6 ${m} (Hinder)` : '') + ` = ${total}`;
  if (hinderBy) detail += ` · Hindered by ${hinderBy}` + (manual > 0 ? ', cancelled by Favor' : '');
  addLog({ who: h.name, text: `${label} · Difficulty ${dc}`, big: total, detail, result, note: result === 'crit' ? opts.critNote : '' });
  renderSheet();
}

    const [sx, sy] = isoPt(p.gx, p.gy, zAt(p.gx, p.gy)), fade = Math.min(1, 3.2 - age);
    for (let k = 0; k < 3; k++) { const a = (age * 1.3 + k / 3) % 1; cx.globalAlpha = (1 - a) * fade; cx.strokeStyle = p.col; cx.lineWidth = 3;
      cx.beginPath(); cx.ellipse(sx, sy, 6 + a * 44, (6 + a * 44) * .5, 0, 0, 7); cx.stroke(); }

  if (!net.steamJoin) return;
  if (ui.modal === 'net' && !isPlayer()) fetch('/steam-hosts', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(list => {
    if (JSON.stringify(list) !== JSON.stringify(net.steamHosts)) { net.steamHosts = Array.isArray(list) ? list : []; renderNet(); }
  }).catch(() => {});
  setTimeout(pollSteamHosts, 3000);
}
requestAnimationFrame(animLoop);
</script>
</body>
</html>
